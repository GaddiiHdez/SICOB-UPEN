<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Top Face (Lighter Green, isometric top perspective) -->
  <path d="M50,10 L85,30 L50,50 L15,30 Z" fill="#6E8E5A" stroke="#2F4A23" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M50,16 L74,30 L50,44 L26,30 Z" fill="#4E6E3A" opacity="0.15" />

  <!-- Left Face (Primary Green, with cuts for letters) -->
  <path d="M15,30 L50,50 L50,90 L15,70 Z" fill="#4E6E3A" stroke="#2F4A23" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Isometric cuts representing the 'S' lines on the left face -->
  <polygon points="20,44 45,58 45,63 20,49" fill="#2F4A23" opacity="0.8" />
  <polygon points="20,59 45,73 45,78 20,64" fill="#2F4A23" opacity="0.8" />
  
  <!-- Right Face (White background, traditional Huichol concentric diamonds) -->
  <path d="M50,50 L85,30 L85,70 L50,90 Z" fill="#FFFFFF" stroke="#2F4A23" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Outer Diamond (Green) -->
  <polygon points="67.5,45 77.5,51 67.5,75 57.5,69" fill="#4E6E3A" />
  
  <!-- Second Diamond (White) -->
  <polygon points="67.5,50 74.5,54.2 67.5,70 60.5,65.8" fill="#FFFFFF" />
  
  <!-- Third Diamond (Green) -->
  <polygon points="67.5,55 71.5,57.4 67.5,65 63.5,62.6" fill="#4E6E3A" />
  
  <!-- Center Dot (White) -->
  <polygon points="67.5,58 69.5,59.2 67.5,62 65.5,60.8" fill="#FFFFFF" />

  <!-- Grid detail / separation lines -->
  <line x1="50" y1="50" x2="50" y2="90" stroke="#2F4A23" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="50" x2="15" y2="30" stroke="#2F4A23" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="50" x2="85" y2="30" stroke="#2F4A23" stroke-width="2.5" stroke-linecap="round" />
</svg>
